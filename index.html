<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的百国足迹地图 V1.0</title>

<!-- Leaflet 免费地图库（CDN） -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  :root{
    --red:#e11d48; --blue:#3b82f6; --gold:#f5b301;
    --gray:#94a3b8; --line:#e5e7eb; --text:#1f2937; --sub:#6b7280;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--text)}
  #app{display:flex;height:100vh;width:100%}

  /* ---------- 侧边栏 ---------- */
  #sidebar{width:350px;flex:0 0 350px;height:100%;display:flex;flex-direction:column;
           background:#fff;border-left:1px solid var(--line);box-shadow:-2px 0 8px rgba(0,0,0,.06);z-index:1000}
  #sidebar header{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
  #sidebar h1{margin:0;font-size:17px;letter-spacing:.5px}
  #sidebar h1 small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-top:4px;line-height:1.6}

  .stats{display:flex;gap:8px;padding:10px 12px}
  .stat{flex:1;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
  .stat b{display:block;font-size:19px;line-height:1.3}
  .stat span{font-size:11px;color:var(--sub)}

  .progress-wrap{padding:0 12px 12px}
  .progress-txt{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;margin-bottom:5px}
  .progress{height:8px;background:#eef2f7;border-radius:99px;overflow:hidden}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--red));transition:width .4s}

  .tabs{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .tabs button{flex:1;padding:9px 0;font-size:13px;background:#fff;border:0;cursor:pointer;color:var(--sub);font-family:inherit}
  .tabs button.on{color:var(--red);font-weight:600;box-shadow:inset 0 -2px 0 var(--red)}

  .list{flex:1;overflow-y:auto;padding:6px 0}
  .list.hide{display:none}
  .item{display:flex;align-items:center;gap:8px;padding:7px 14px;font-size:13px;cursor:pointer}
  .item:hover{background:#f8fafc}
  .item .dot{flex:0 0 auto;width:11px;height:11px;border-radius:50%;background:var(--blue);opacity:.85}
  .item .dot.done{background:var(--red);opacity:1;box-shadow:0 0 0 2px var(--gold)}
  .item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .name em{font-style:normal;color:var(--sub);font-size:11px;margin-left:4px}
  .item .badge{font-size:10px;color:var(--red);border:1px solid var(--red);border-radius:99px;padding:0 6px}
  .list-note{font-size:11px;color:var(--sub);padding:8px 14px 14px;line-height:1.7;border-top:1px solid var(--line)}
  /* ---------- 地图 ---------- */
  #map{flex:1;height:100%;background:#eef2f7}
  .pin{background:none;border:0}
  .pin .dot{display:block;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
  .dot-visited{width:14px;height:14px;background:var(--red)}
  .dot-bucket{width:12px;height:12px;background:var(--blue);opacity:.85}
  .dot-done{width:18px;height:18px;background:var(--red);border:3px solid var(--gold)!important;box-shadow:0 0 8px var(--gold)!important}
  .leaflet-popup-content{margin:0;width:250px!important;font-family:inherit}
  .leaflet-popup-content-wrapper{border-radius:10px;padding:0;overflow:hidden}

  /* ---------- Popup 卡片 ---------- */
  .pop-img{width:100%;height:120px;object-fit:cover;display:block;background:#f1f5f9}
  .pop-ph{width:100%;height:70px;display:flex;align-items:center;justify-content:center;
          background:#f1f5f9;color:var(--gray);font-size:12px}
  .pop-body{padding:10px 12px 12px}
  .pop-body h3{margin:0 0 6px;font-size:15px}
  .pop-body h3 span{font-size:11px;font-weight:400;color:var(--sub);margin-left:4px}
  .pop-row{font-size:12px;color:var(--sub);margin-bottom:4px}
  .pop-note{font-size:12.5px;line-height:1.6;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}

  /* ---------- 图例 / 图层开关 ---------- */
  .legend{position:absolute;left:10px;bottom:22px;z-index:800;background:rgba(255,255,255,.95);
          border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12px;
          box-shadow:0 2px 8px rgba(0,0,0,.12);line-height:1.9}
  .legend b{display:block;font-size:11px;color:var(--sub);margin-bottom:2px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
  .legend i.red{background:var(--red)}
  .legend i.blue{background:var(--blue)}
  .legend i.gold{background:var(--red);box-shadow:0 0 0 2px var(--gold)}
  .legend label{display:block;cursor:pointer;user-select:none;margin-top:5px;padding-top:5px;border-top:1px dashed var(--line)}
  .legend input{vertical-align:-1px;margin-right:5px}
  .err{padding:20px;font-size:13px;color:var(--red);background:#fff;margin:12px;border-radius:8px}
  .tile-warn{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:900;
             background:#fff5f5;border:1px solid var(--red);color:var(--red);border-radius:8px;
             padding:6px 12px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  @media(max-width:700px){
    #app{flex-direction:column}
    #sidebar{width:100%;flex:0 0 46%;height:46%;border-left:0;border-top:1px solid var(--line)}
    #map{height:54%}
  }

</style>
</head>
<body>
<div id="app">
  <div id="map"></div>

  <aside id="sidebar">
    <header>
      <h1>🌍 我的旅行足迹地图 <small>MVP V1.0 · 记录去过的地方，对照全球最推荐的 100 个目的地</small></h1>
    </header>

    <div class="stats">
      <div class="stat"><b id="sPlaces">0</b><span>已打卡地点</span></div>
      <div class="stat"><b id="sCountries">0</b><span>已到访国家/地区</span></div>
      <div class="stat"><b id="sDone">0</b><span>推荐地已打卡</span></div>
    </div>

    <div class="progress-wrap">
      <div class="progress-txt"><span>推荐清单完成度</span><span id="sRatio">0 / 100</span></div>
      <div class="progress"><i id="bar"></i></div>
    </div>

    <div class="tabs">
      <button class="on" data-tab="bucket">推荐 100 目的地</button>
      <button data-tab="visited">我的足迹</button>
    </div>

    <div class="list" id="listBucket"></div>
    <div class="list hide" id="listVisited"></div>
    <div class="list-note" id="dataNote"></div>
  </aside>
</div>

// 全球最推荐目的地（示例 50 条；把 BUCKET_TARGET 保持 100 并继续往下补充即可）
// 格式：[中文名, 英文名(用于与足迹自动比对), 国家/地区, 纬度, 经度]
const BUCKET_TARGET = 100;
const BUCKET = [

/* ============================================================
   ② 初始化地图（Leaflet + OpenStreetMap 标准免费瓦片，无需 API Key）
   ============================================================ */
const HOME = { center: [22, 105], zoom: 3 };
const map = L.map('map', { minZoom: 2, maxZoom: 18, worldCopyJump: true }).setView(HOME.center, HOME.zoom);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> 贡献者',
  subdomains: 'abc', maxZoom: 19
}).addTo(map);

// 瓦片加载失败时给出一次性提示（避免出现空白底图却不知道为什么）
let tileWarned = false;
map.on('tileerror', () => {
  if (tileWarned) return;
  tileWarned = true;
  const w = document.createElement('div');
  w.className = 'tile-warn';
  w.textContent = '⚠️ 地图底图加载失败，请检查网络（tile.openstreetmap.org）';
  document.querySelector('#map').appendChild(w);
});

// 一个「回到全球视角」小按钮
const HomeCtl = L.Control.extend({
  options: { position: 'topleft' },
  onAdd() {
    const b = L.DomUtil.create('button', 'leaflet-bar');
    b.textContent = '🌍'; b.title = '回到全球视角'; b.type = 'button';
    b.style.cssText = 'width:30px;height:30px;font-size:15px;line-height:1;cursor:pointer;background:#fff;border:0';
    L.DomEvent.on(b, 'click', e => { L.DomEvent.stop(e); map.setView(HOME.center, HOME.zoom); });
    return b;
  }
});
map.addControl(new HomeCtl());

/* ============================================================
   ③ 足迹 ↔ 推荐清单 自动比对
   把 "普吉岛 Phuket" 拆成英文词，与推荐地的英文名做交集匹配
   ============================================================ */
const tokenOf = s => String(s).toLowerCase().split(/[^a-z0-9]+/).filter(t => t.length > 2);

const visitedTokens = new Set();
VISITED.forEach(v => tokenOf(v[0]).forEach(t => visitedTokens.add(t)));
const bucketTokens = new Set();
BUCKET.forEach(b => tokenOf(b[1]).forEach(t => bucketTokens.add(t)));

const inBucketList = name => tokenOf(name).some(t => bucketTokens.has(t));   // 足迹里的点是否属于推荐清单
const isBucketDone = b => tokenOf(b[1]).some(t => visitedTokens.has(t));     // 推荐地是否已打卡

/* ============================================================
   ④ 图标与卡片（Popup）
   ============================================================ */
const dotIcon = (cls, size) => L.divIcon({
  className: 'pin',
  html: '<span class="dot ' + cls + '"></span>',
  iconSize: [size, size], iconAnchor: [size / 2, size / 2], popupAnchor: [0, -size / 2 - 2]
});

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// 图片加载失败时换成占位块
window.__imgFail = function (el) {
  const d = document.createElement('div');
  d.className = 'pop-ph';
  d.textContent = '📷 图片未能加载：' + (el.getAttribute('data-src') || '');
  el.replaceWith(d);
};
const imgHtml = (src, title) => src
  ? '<img class="pop-img" src="' + esc(src) + '" data-src="' + esc(src) + '" alt="' + esc(title) + '" onerror="__imgFail(this)">'
  : '<div class="pop-ph">📷 暂无照片 · 把图片放进 images/ 或在数据里填 URL</div>';

const popVisited = (v, gold) => {
  const [city, country, , , who, note, img] = v;
  return imgHtml(img, city) +
    '<div class="pop-body">' +
      '<h3>' + esc(city) + '<span>' + esc(country) + '</span></h3>' +
      (gold ? '<div class="pop-row">🏅 已在「全球推荐 ' + BUCKET_TARGET + ' 目的地」清单内</div>' : '') +
      '<div class="pop-row">🧑‍🤝‍🧑 同行：' + esc(who || '—') + '</div>' +
      '<div class="pop-note">📝 ' + esc(note || '还没有写回忆～') + '</div>' +
    '</div>';
};

const popBucket = b => {
  const [cn, en, country] = b;
  return '<div class="pop-body" style="padding-top:12px">' +
      '<h3>' + esc(cn) + '<span>' + esc(country) + '</span></h3>' +
      '<div class="pop-row">🌐 ' + esc(en) + '</div>' +
      '<div class="pop-row">🎯 状态：想去（还没打卡）</div>' +
      '<div class="pop-note">💡 从「推荐 ' + BUCKET_TARGET + ' 目的地」清单中的愿望，去过之后它会自动变成带金边的红点。</div>' +
    '</div>';
};
/* ============================================================
   ⑤ 打点：足迹（红 / 金边红）、推荐清单（蓝）
   ============================================================ */
const visitedLayer = L.layerGroup().addTo(map);
const bucketLayer = L.layerGroup().addTo(map);

const visitedPins = VISITED.map((v, i) => {
  const [city, country, lat, lng] = v;
  const gold = inBucketList(city);   // 命中推荐清单 → 高亮
  const marker = L.marker([lat, lng], {
    icon: dotIcon(gold ? 'dot-done' : 'dot-visited', gold ? 18 : 14), title: city
  }).addTo(visitedLayer).bindPopup(popVisited(v, gold)).bindTooltip(city + (gold ? ' 🏅' : ''));
  return { v, i, gold, marker };
});

// 推荐点：未打卡的画蓝点；已打卡的直接用上面那个「红+金边」点，避免两点重叠
const bucketPins = BUCKET.map((b, i) => {
  const done = isBucketDone(b);
  let marker = null;
  if (done) {
    const hit = visitedPins.find(p => tokenOf(p.v[0]).some(t => tokenOf(b[1]).includes(t)));
    marker = hit ? hit.marker : null;
  } else {
    marker = L.marker([b[3], b[4]], { icon: dotIcon('dot-bucket', 12), title: b[0] })
      .addTo(bucketLayer).bindPopup(popBucket(b)).bindTooltip(b[0]);
  }
  return { b, i, done, marker };
});

/* ============================================================
   ⑥ 侧边栏统计 + 列表
   ============================================================ */
const doneTotal = bucketPins.filter(p => p.done).length;
const $ = id => document.getElementById(id);
$('sPlaces').textContent = VISITED.length;
$('sCountries').textContent = new Set(VISITED.map(v => v[1])).size;
$('sDone').textContent = doneTotal;
$('sRatio').textContent = doneTotal + ' / ' + BUCKET_TARGET;
$('bar').style.width = Math.min(100, doneTotal / BUCKET_TARGET * 100).toFixed(1) + '%';
$('dataNote').innerHTML =
  '📊 足迹 ' + VISITED.length + ' 条 · 推荐清单已内置 ' + BUCKET.length + ' 条示例（目标 ' + BUCKET_TARGET + ' 条，已打卡 ' + doneTotal + ' 条）。<br>' +
  '📷 图片：在本文件同目录新建 images/ 放图片，或在数据里直接填在线 URL。<br>' +
  '✏️ 直接编辑本文件顶部的 VISITED / BUCKET 数组即可更新地图。';

const listBucket = $('listBucket'), listVisited = $('listVisited');

listBucket.innerHTML = bucketPins.map(p =>
  '<div class="item" data-k="b' + p.i + '">' +
    '<span class="dot' + (p.done ? ' done' : '') + '"></span>' +
    '<span class="name">' + esc(p.b[0]) + '<em>' + esc(p.b[2]) + '</em></span>' +
    (p.done ? '<span class="badge">已打卡</span>' : '') +
  '</div>').join('');

listVisited.innerHTML = VISITED.map((v, i) => {
  const gold = visitedPins[i].gold;
  return '<div class="item" data-k="v' + i + '">' +
    '<span class="dot' + (gold ? ' done' : '') + '"></span>' +
    '<span class="name">' + esc(v[0]) + '<em>' + esc(v[1]) + '</em></span>' +
    (gold ? '<span class="badge">🏅 推荐</span>' : '') +
  '</div>';
}).join('');

// 列表点击 → 地图定位并打开卡片
const pinMap = {};
bucketPins.forEach(p => { if (p.marker) pinMap['b' + p.i] = p.marker; });
visitedPins.forEach(p => { pinMap['v' + p.i] = p.marker; });

function jump(key, zoom) {
  const m = pinMap[key];
  if (!m) return;
  map.setView(m.getLatLng(), zoom, { animate: false });   // 立即定位，不做动画
  m.openPopup();
}
listBucket.addEventListener('click', e => { const el = e.target.closest('.item'); if (el) jump(el.dataset.k, 6); });
listVisited.addEventListener('click', e => { const el = e.target.closest('.item'); if (el) jump(el.dataset.k, 7); });

// Tab 切换
document.querySelectorAll('.tabs button').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b === btn));
  listBucket.classList.toggle('hide', btn.dataset.tab !== 'bucket');
  listVisited.classList.toggle('hide', btn.dataset.tab !== 'visited');
}));

/* ============================================================
   ⑦ 图例 + 图层开关
   ============================================================ */
const legend = document.createElement('div');
legend.className = 'legend';
legend.innerHTML =
  '<b>图例</b>' +
  '<div><i class="red"></i>已去过</div>' +
  '<div><i class="blue"></i>推荐目的地（未打卡）</div>' +
  '<div><i class="gold"></i>推荐目的地（已打卡）</div>' +
  '<label><input type="checkbox" id="cbV" checked>我的足迹</label>' +
  '<label><input type="checkbox" id="cbB" checked>推荐清单</label>';
document.querySelector('#map').appendChild(legend);

$('cbV').addEventListener('change', e => e.target.checked ? map.addLayer(visitedLayer) : map.removeLayer(visitedLayer));
$('cbB').addEventListener('change', e => e.target.checked ? map.addLayer(bucketLayer) : map.removeLayer(bucketLayer));

// 窗口尺寸变化后让地图重新计算尺寸
window.addEventListener('resize', () => map.invalidateSize());
setTimeout(() => map.invalidateSize(), 200);



</script>

</body>
</html>
